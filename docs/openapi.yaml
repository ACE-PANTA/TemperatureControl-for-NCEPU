openapi: 3.1.0
info:
  title: Temperature Control External API
  version: 1.0.0
  description: |
    Local HTTP API for the Temperature Control desktop application.
    The service listens on 127.0.0.1:8056 and forwards commands to the existing serial or ethernet control channel.
servers:
  - url: http://127.0.0.1:8056
    description: Local desktop service
tags:
  - name: Health
  - name: Snapshot
  - name: Control
  - name: PID
  - name: Persistence
paths:
  /health:
    get:
      tags: [Health]
      summary: Check service health
      operationId: getHealth
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatusResponse"
  /api/status:
    get:
      tags: [Health]
      summary: Get external service status
      operationId: getApiStatus
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatusResponse"
  /api/snapshot:
    get:
      tags: [Snapshot]
      summary: Get latest cached system snapshot
      operationId: getSnapshot
      responses:
        "200":
          description: Latest snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
  /api/refresh:
    post:
      tags: [Snapshot]
      summary: Query controller and refresh snapshot
      operationId: refreshSnapshot
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelRequest"
      responses:
        "200":
          description: Refreshed snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/mode:
    post:
      tags: [Control]
      summary: Switch controller mode
      operationId: setMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetModeRequest"
      responses:
        "200":
          description: Mode switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/manual-pwm:
    post:
      tags: [Control]
      summary: Set manual PWM output
      operationId: setManualPwm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetManualPwmRequest"
      responses:
        "200":
          description: PWM updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/target-temperature:
    post:
      tags: [Control]
      summary: Set target temperature for AUTO mode
      operationId: setTargetTemperature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTargetTemperatureRequest"
      responses:
        "200":
          description: Target temperature updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/pid/tran:
    post:
      tags: [PID]
      summary: Set TRAN condition PID parameters
      operationId: setTranPid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTranPidRequest"
      responses:
        "200":
          description: TRAN PID updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/pid/fine:
    post:
      tags: [PID]
      summary: Set FINE condition PID parameters
      operationId: setFinePid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFinePidRequest"
      responses:
        "200":
          description: FINE PID updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/pid/deadband:
    post:
      tags: [PID]
      summary: Set shared PID deadband
      operationId: setDeadband
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDeadbandRequest"
      responses:
        "200":
          description: Deadband updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/pid/fine-enable:
    post:
      tags: [PID]
      summary: Enable or disable FINE condition entry
      operationId: setFineEnable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFineEnableRequest"
      responses:
        "200":
          description: FINE enable flag updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/save:
    post:
      tags: [Persistence]
      summary: Save current device configuration
      operationId: saveConfig
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelRequest"
      responses:
        "200":
          description: Configuration saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "500":
          $ref: "#/components/responses/Error"
  /mcp:
    post:
      tags: [Control]
      summary: MCP JSON-RPC endpoint
      operationId: callMcp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpJsonRpcRequest"
      responses:
        "200":
          description: MCP JSON-RPC response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpJsonRpcResponse"
components:
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Channel:
      type: string
      enum: [serial, ethernet]
      description: Target command channel. If omitted, the current primary channel is used.
    ChannelRequest:
      type: object
      additionalProperties: false
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
    SetModeRequest:
      allOf:
        - $ref: "#/components/schemas/ChannelRequest"
        - type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [AUTO, MAN]
              description: AUTO for automatic control, MAN for manual PWM control.
    SetManualPwmRequest:
      allOf:
        - $ref: "#/components/schemas/ChannelRequest"
        - type: object
          required: [pwm]
          properties:
            pwm:
              type: number
              minimum: -100
              maximum: 100
              description: Manual PWM output percentage.
    SetTargetTemperatureRequest:
      allOf:
        - $ref: "#/components/schemas/ChannelRequest"
        - type: object
          required: [temperature]
          properties:
            temperature:
              type: number
              description: Target temperature in degrees Celsius.
    SetTranPidRequest:
      allOf:
        - $ref: "#/components/schemas/ChannelRequest"
        - type: object
          required: [kp, ki, kd]
          properties:
            kp:
              type: number
            ki:
              type: number
            kd:
              type: number
            interval:
              type: number
              description: Adjustment interval in seconds.
            sepThreshold:
              type: number
              description: Integral separation threshold in degrees Celsius.
    SetFinePidRequest:
      allOf:
        - $ref: "#/components/schemas/ChannelRequest"
        - type: object
          required: [kp, ki, kd]
          properties:
            kp:
              type: number
            ki:
              type: number
            kd:
              type: number
            interval:
              type: number
              description: Adjustment interval in seconds.
            range:
              type: number
              description: Maximum output change per adjustment step.
            entryMin:
              type: number
              description: Minimum absolute error to enter FINE condition.
            entryMax:
              type: number
              description: Maximum absolute error to enter FINE condition.
            stableWindow:
              type: number
              description: Stability window in seconds.
            stableDelta:
              type: number
              description: Stability temperature delta in degrees Celsius.
    SetDeadbandRequest:
      allOf:
        - $ref: "#/components/schemas/ChannelRequest"
        - type: object
          required: [deadband]
          properties:
            deadband:
              type: number
              description: Shared PID deadband in degrees Celsius.
    SetFineEnableRequest:
      allOf:
        - $ref: "#/components/schemas/ChannelRequest"
        - type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
              description: Whether FINE condition entry is allowed.
    ServiceStatusResponse:
      type: object
      required: [ok, services]
      properties:
        ok:
          type: boolean
          const: true
        services:
          $ref: "#/components/schemas/Services"
    SnapshotResponse:
      type: object
      required: [ok, snapshot]
      properties:
        ok:
          type: boolean
          const: true
        snapshot:
          anyOf:
            - $ref: "#/components/schemas/Snapshot"
            - type: "null"
    ActionResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: object
          additionalProperties: true
        snapshot:
          anyOf:
            - $ref: "#/components/schemas/Snapshot"
            - type: "null"
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
    Services:
      type: object
      properties:
        http:
          type: object
          properties:
            port:
              type: integer
              example: 8056
            running:
              type: boolean
            error:
              type: string
        websocket:
          type: object
          properties:
            port:
              type: integer
              example: 8057
            running:
              type: boolean
            error:
              type: string
            clients:
              type: integer
        mcp:
          type: object
          properties:
            port:
              type: integer
              example: 8056
            path:
              type: string
              example: /mcp
            running:
              type: boolean
            error:
              type: string
        renderer:
          type: object
          properties:
            ready:
              type: boolean
            lastSnapshotAt:
              anyOf:
                - type: integer
                - type: "null"
    Snapshot:
      type: object
      properties:
        version:
          type: integer
        timestamp:
          type: integer
        exportedAt:
          type: integer
        connection:
          type: object
          properties:
            primaryChannel:
              anyOf:
                - $ref: "#/components/schemas/Channel"
                - type: "null"
            serial:
              $ref: "#/components/schemas/ConnectionChannel"
            ethernet:
              $ref: "#/components/schemas/ConnectionChannel"
        controller:
          type: object
          properties:
            mode:
              anyOf:
                - type: string
                  enum: [AUTO, MAN]
                - type: "null"
            phase:
              anyOf:
                - type: string
                  enum: [MAN, TRAN, FINE]
                - type: "null"
            pwm:
              anyOf:
                - type: number
                - type: "null"
            targetTemperature:
              anyOf:
                - type: number
                - type: "null"
            feedbackTemperature:
              anyOf:
                - type: number
                - type: "null"
            updatedAt:
              anyOf:
                - type: integer
                - type: "null"
        pid:
          type: object
          properties:
            tran:
              $ref: "#/components/schemas/TranPid"
            fine:
              $ref: "#/components/schemas/FinePid"
            deadband:
              type: number
            fineEnabled:
              type: boolean
            lastApplied:
              type: object
              additionalProperties: true
            latestDispatch:
              anyOf:
                - type: object
                  additionalProperties: true
                - type: "null"
        sample:
          type: object
          additionalProperties: true
        recording:
          type: object
          additionalProperties: true
        services:
          $ref: "#/components/schemas/Services"
    ConnectionChannel:
      type: object
      properties:
        connected:
          type: boolean
        label:
          type: string
    TranPid:
      type: object
      properties:
        kp:
          type: number
        ki:
          type: number
        kd:
          type: number
        interval:
          type: number
        sepThreshold:
          type: number
    FinePid:
      type: object
      properties:
        kp:
          type: number
        ki:
          type: number
        kd:
          type: number
        interval:
          type: number
        range:
          type: number
        entryMin:
          type: number
        entryMax:
          type: number
        stableWindow:
          type: number
        stableDelta:
          type: number
    McpJsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          anyOf:
            - type: string
            - type: integer
            - type: "null"
        method:
          type: string
          examples: [initialize, tools/list, tools/call]
        params:
          type: object
          additionalProperties: true
    McpJsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          anyOf:
            - type: string
            - type: integer
            - type: "null"
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
